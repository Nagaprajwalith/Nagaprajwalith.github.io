<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060918" />
    <script>
      // Pick the theme before first paint: saved choice, else the system setting
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) { document.documentElement.classList.add('dark') }
    </script>
    <meta name="description" content="Naga Prajwalith P, Data Engineer in Hyderabad. PySpark and Azure Databricks pipelines, ML and AI projects, skills and contact." />
    <title>Naga Prajwalith P | Data Engineer</title>
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Link previews (LinkedIn, WhatsApp, X, Slack) -->

    <meta property="og:title" content="Naga Prajwalith P | Data Engineer" />
